name: Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.bundle.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore project
        shell: bash
        run: |
          set -euo pipefail

          for f in *.bundle.zip; do
            unzip -q -o "$f"
          done

      - name: Fix Flutter API service
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          p = Path("lib/services/api_service.dart")
          s = p.read_text()

          old = "headers:headers(false)"
          new = "headers:headers()"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("FIXED: headers(false) -> headers()")
          else:
              print("No headers(false) found. File is already fixed.")
          PY

          grep -n "v9ProductionReadiness" lib/services/api_service.dart || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Generate Android platform
        working-directory: app
        run: |
          flutter create --platforms=android --org com.nexcodeai .

      - name: Configure OAuth deep link
        working-directory: app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          marker = "</activity>"

          block = '''<intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data
                    android:scheme="nexcode"
                    android:host="oauth"
                    android:path="/callback" />
              </intent-filter>
              '''

          if 'android:scheme="nexcode"' not in s:
              if marker in s:
                  s = s.replace(marker, block + marker, 1)
                  p.write_text(s)
                  print("OAuth deep link added.")
              else:
                  raise SystemExit("AndroidManifest activity marker not found.")
          else:
              print("OAuth deep link already exists.")
          PY

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=NEXCODE_API_URL=${{ secrets.NEXCODE_API_URL }}

      - name: Build AAB
        working-directory: app
        run: |
          flutter build appbundle --release \
            --dart-define=NEXCODE_API_URL=${{ secrets.NEXCODE_API_URL }}

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: nexcode-android-builds
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
